name: Check Webtoon episodes

on:
  schedule:
    - cron: "17 * * * *"   # every hour at :17 (UTC)
  workflow_dispatch:        # lets you run it manually from the Actions tab

permissions:
  contents: write           # needed to save state.json back to the repo

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tracker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tracker.py

      - name: Save state
        run: |
          git config user.name "tracker-bot"
          git config user.email "tracker-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Update seen episodes"
          git push
